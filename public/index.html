<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folio · Books worth keeping</title>
    <meta name="description" content="Folio is a small online bookstore for classics worth keeping." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <p class="notice">Free shipping on orders over ₹999 · New: Gitanjali, illustrated edition</p>

    <header class="masthead">
      <a class="wordmark" href="#/">Folio</a>
      <nav class="nav">
        <a href="#/">Shop</a>
        <a href="#/track">Track an order</a>
      </nav>
      <button class="cart-button" id="open-cart" type="button">Cart <span id="cart-count">0</span></button>
    </header>

    <main id="view"></main>

    <aside class="cart" id="cart" aria-hidden="true" aria-label="Your cart">
      <div class="cart-head">
        <h2>Your cart</h2>
        <button class="icon-button" id="close-cart" type="button" aria-label="Close cart">×</button>
      </div>
      <div id="cart-body"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <p class="toast" id="toast" role="alert" hidden></p>

    <footer class="footer">
      <p>Folio · Books worth keeping</p>
      <p>Folio is a demo storefront: no payments are taken.</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
